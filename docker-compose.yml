services:
  # Databse Service
  database:
    image: mysql:8.0
    container_name: agro-mysql-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  # Web Server...Service
  webserver:
    build:
      context: .
      dockerfile: ./webserver/Dockerfile
    container_name: agro_web-Server
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - uploads_data:/var/www/uploads
    environment:
      DB_HOST: database
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    depends_on:
      - database
    restart: always

volumes:
  db_data:
