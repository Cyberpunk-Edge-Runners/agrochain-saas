name: cultinet-saas

services:
  # Web Server Service
  #
  # No "database" service anymore — MySQL now lives on AWS RDS, not in a
  # local container. DB_HOST below points at the real RDS endpoint
  # (from .env) instead of the old "database" service name, and there's
  # no `depends_on` for a database container that no longer exists.
  webserver:
    build:
      context: .
      dockerfile: ./webserver/Dockerfile
    container_name: cultinet-Server
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
      - ./includes:/var/www/includes
      - uploads_data:/var/www/uploads
    environment:
      DB_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    restart: always

volumes:
  uploads_data: