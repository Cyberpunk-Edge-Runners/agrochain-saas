# webserver/000-default.conf
#
# Replaces the default Apache vhost baked into the php:8.2-apache image.
# The only real change vs. the stock config is AllowOverride All below —
# that's what lets public/.htaccess actually be read and take effect.
# The rewrite rules themselves live in public/.htaccess, not here.

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # AllowOverride All means Apache reads a .htaccess file (if one
        # exists) in this directory and applies whatever directives it
        # contains — that's the whole mechanism that makes public/.htaccess
        # do anything at all. With the default AllowOverride None, Apache
        # would silently ignore .htaccess entirely, and the rewrite rules
        # in it would just never run, no error, nothing — that's a common
        # trap people hit with "the rewrite rules aren't working," so it's
        # worth knowing this line is the reason they do here.
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>