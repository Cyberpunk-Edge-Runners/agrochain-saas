; webserver/uploads.ini
;
; Gets copied into /usr/local/etc/php/conf.d/ by the Dockerfile, which is
; where php:8.2-apache looks for additional config on top of its built-in
; defaults.
;
; WHY upload_max_filesize / post_max_size ARE SET HIGHER THAN OUR 5MB LIMIT:
; PHP checks its own post_max_size BEFORE any of our code runs. If a request
; body is bigger than that limit, PHP wipes $_POST and $_FILES entirely and
; emits a raw warning — our app-level size check in upload-documents.php
; never even gets a chance to run. Setting these above our 5MB app limit
; means OUR check is what actually rejects an oversized file, with a clean
; message, instead of PHP dying first with a confusing one.
upload_max_filesize = 10M
post_max_size = 12M

; WHY display_errors IS OFF:
; By default PHP prints warnings/notices/fatal errors directly onto the
; page. On a live site that can leak file paths, internal logic, or worse
; to anyone who trips a warning. Errors still get captured (log_errors =
; On), just server-side instead of shown to whoever's looking at the page.
display_errors = Off
log_errors = On
error_log = /dev/stderr